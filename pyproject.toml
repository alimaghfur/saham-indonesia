[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saham-id"
version = "0.1.0"
description = "Analytics & screener toolkit for Indonesia Stock Exchange (IDX)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "saham-indonesia contributors" }]
keywords = ["idx", "indonesia", "stock", "saham", "screener", "trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Core data
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # Data sources
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # CLI & UX
    "typer>=0.12",
    "rich>=13.7",
    # Charting
    "plotly>=5.22",
    "kaleido>=0.2.1",
    # Utils
    "python-dateutil>=2.9",
    "tenacity>=8.2",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.22",
]
realtime = [
    "websockets>=12.0",
]

[project.scripts]
saham = "saham_id.cli:app"

[project.urls]
Homepage = "https://github.com/alimaghfur/saham-indonesia"
Issues = "https://github.com/alimaghfur/saham-indonesia/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/saham_id"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
