# ============================================================
# saham-indonesia — Docker Compose
# ============================================================
# Quick start:
#   docker compose up dashboard
#   Open http://localhost:8501
# ============================================================

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - SAHAM_ID_LOG_LEVEL=INFO
      - SAHAM_ID_CACHE_DIR=/app/data/cache
    volumes:
      - cache-data:/app/data/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import saham_id; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: run CLI commands
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    entrypoint: ["saham"]
    # Usage: docker compose run cli quote BBCA
    profiles:
      - tools

volumes:
  cache-data:
