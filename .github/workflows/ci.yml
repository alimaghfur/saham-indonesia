name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.5"

      - name: Ruff lint
        run: ruff check src tests scripts dashboard

  test:
    name: Pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          SAHAM_ID_DATA_SOURCES: yahoo
          # Empty keys are fine — tests use FakeSource, never hit network.
          ITICK_API_KEY: ""
          GOAPI_API_KEY: ""
          SECTORS_API_KEY: ""
        run: pytest --cov=src/saham_id --cov-report=term-missing -q

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: .coverage
          if-no-files-found: ignore
          retention-days: 7

  # Optional smoke: make sure the CLI imports cleanly on the matrix.
  cli-smoke:
    name: CLI import smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: `saham --help`
        run: saham --help

      - name: `saham sources`
        run: saham sources

      - name: `saham universes`
        run: saham universes
