name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings httpx typer rich tenacity cachetools python-dateutil

      - name: Verify syntax (all .py files compile)
        run: |
          python -c "
          import py_compile, os, sys
          errors, total = [], 0
          for d in ['src/saham_id', 'tests', 'dashboard', 'notebooks']:
              if not os.path.isdir(d):
                  continue
              for root, _, files in os.walk(d):
                  for f in files:
                      if f.endswith('.py'):
                          total += 1
                          path = os.path.join(root, f)
                          try:
                              py_compile.compile(path, doraise=True)
                          except py_compile.PyCompileError as e:
                              errors.append(str(e))
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          print(f'All {total} .py files compile OK')
          "

      - name: Run tests (using stubs, no pandas/numpy required)
        run: python run_tests.py
        env:
          PYTHONPATH: stubs:src

      - name: Verify all module imports
        run: |
          PYTHONPATH=stubs:src python -c "
          import sys
          modules = [
              'saham_id', 'saham_id.config', 'saham_id.data', 'saham_id.data.models',
              'saham_id.data.universe', 'saham_id.data.sources', 'saham_id.data.sources.base',
              'saham_id.data.sources.yahoo_finance', 'saham_id.data.sources.itick',
              'saham_id.data.sources.goapi', 'saham_id.data.sources.rti_scraper',
              'saham_id.data.sources.sectors_app', 'saham_id.analysis',
              'saham_id.analysis.indicators', 'saham_id.analysis.fundamental',
              'saham_id.analysis.valuation', 'saham_id.analysis.risk',
              'saham_id.backtest', 'saham_id.backtest.engine', 'saham_id.backtest.metrics',
              'saham_id.backtest.strategies', 'saham_id.screener', 'saham_id.screener.engine',
              'saham_id.screener.intraday', 'saham_id.screener.intraday.bpjs',
              'saham_id.screener.intraday.bsjp', 'saham_id.screener.intraday.scalping',
              'saham_id.screener.intraday.session', 'saham_id.screener.swing',
              'saham_id.screener.swing.breakout', 'saham_id.screener.swing.pullback',
              'saham_id.screener.swing.reversal', 'saham_id.market',
              'saham_id.market.breadth', 'saham_id.market.movers', 'saham_id.market.trending',
              'saham_id.market.unusual_activity', 'saham_id.portfolio',
              'saham_id.portfolio.tracker', 'saham_id.indices', 'saham_id.indices.idx_indices',
              'saham_id.utils', 'saham_id.utils.formatting', 'saham_id.utils.logging',
              'saham_id.utils.calendar', 'saham_id.cli',
          ]
          failed = []
          for mod in modules:
              try:
                  __import__(mod)
              except Exception as e:
                  failed.append((mod, str(e)))
          if failed:
              for m, e in failed:
                  print(f'FAIL: {m} -> {e}')
              sys.exit(1)
          print(f'ALL {len(modules)} modules imported OK')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src/ tests/ --exit-zero

  test-with-pandas:
    runs-on: ubuntu-latest
    # This job installs real pandas/numpy to verify the actual library works
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest with real pandas
        run: pytest tests/ -v --tb=short -x
        env:
          PYTHONPATH: src
